<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
        }

        .navbar {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 9%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            visibility: hidden;
            opacity: 0;
            animation: show-content 1.5s linear forwards;
            animation-delay: 1s;
        }

        @keyframes show-content {
            100% {
                visibility: visible;
                opacity: 1;
            }
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
        }

        .navbar ul {
            display: flex;
        }

        .navbar ul li {
            list-style: none;
            margin: 35px;
        }

        .navbar ul li a {
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            transition: 0.5s;
        }

        .navbar ul li a:hover,
        .navbar ul li.active a {
            color: #7cf03d;
        }

        /* Projects section */
        .projects {
            padding: 120px 9% 60px;
            min-height: 100vh;
            visibility: hidden;
            opacity: 0;
            animation: show-content 1.5s linear forwards;
            animation-delay: 1.2s;
        }

        .projects h1 {
            text-align: center;
            font-size: 45px;
            color: #7cf03d;
            margin-bottom: 50px;
            letter-spacing: 1px;
        }

        .projects-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #7cf03d;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: 0.4s ease;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.1);
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 20px rgba(124, 240, 61, 0.6);
        }

        .project-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #7cf03d;
        }

        .project-card h2 {
            font-size: 22px;
            color: #7cf03d;
            margin-bottom: 10px;
        }

        .project-card p {
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
            margin-bottom: 15px;
        }

        .btn {
            display: inline-block;
            background: palegreen;
            border: 2px solid lime;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            font-size: 16px;
            color: #000;
            font-weight: 600;
            padding: 10px 30px;
            border-radius: 40px;
            transition: 0.5s;
        }

        .btn:hover {
            background: transparent;
            color: #7cf03d;
            box-shadow: none;
        }

        /* Animation background bars */
        .bars-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: -1;
        }

        .bars-animation .bar {
            height: 100%;
            width: 100%;
            background: #000;
            transform: translateY(-100%);
            animation: show-bar 0.5s ease-in-out forwards;
            animation-delay: calc(0.1s * var(--1));
        }

        @keyframes show-bar {
            100% {
                transform: translateY(0%);
            }
        }

        @media (max-width: 768px) {
            .projects h1 {
                font-size: 35px;
            }

            .navbar ul li {
                margin: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
   <nav class="navbar">
        <div class="logo"> Belinda Mukhaye</div>
        <ul class="nav-links">
            <li class="active"><a href="/">Home</a></li>
            <li><a href="/aboutus.html">About</a></li>
            <li><a href="/skills.html">Skills</a></li>
            <li><a href="/projects.html">Projects</a></li>
            <li><a href="/contact.html">Contact</a></li>
            
        </ul>
    </nav>

    <!-- Projects Section -->
    <section class="projects">
        <h1>My Projects</h1>

        <div class="projects-container">
            <div class="project-card">
                <!-- <img src="assets/project1.jpg" alt="Project 1"> -->
                <h2>KARIBU GROCERY</h2>
                <p>An Inventory Management System built with Django and React.</p>
                <a href="https://github.com/belinda-png/lastone.git" class="btn" target="_blank">View Code</a>
            </div>

            <div class="project-card">
                <!-- <img src="assets/project2.jpg" alt="Project 2"> -->
                <h2>ONLINE BOOKING SYSTEM</h2>
                <p>An Online Booking tracking system with user authentication and real-time notifications.</p>
                <a href="https://github.com/belinda-png/online.git" class="btn" target="_blank">View Code</a>
            </div>

            <!-- <div class="project-card">
                <img src="assets/project3.jpg" alt="Project 3">
                <h2>AI Chatbot</h2>
                <p>An AI chatbot built with Python and OpenAI API to provide real-time responses and sentiment analysis.</p>
                <a href="https://github.com/yourname/aichatbot" class="btn" target="_blank">View Code</a>
            </div>
        </div> -->
    </section>

    <div class="bars-animation">
        <div class="bar" style="--1:1"></div>
        <div class="bar" style="--1:2"></div>
        <div class="bar" style="--1:3"></div>
        <div class="bar" style="--1:4"></div>
        <div class="bar" style="--1:5"></div>
        <div class="bar" style="--1:6"></div>
        <div class="bar" style="--1:7"></div>
        <div class="bar" style="--1:8"></div>
        <div class="bar" style="--1:9"></div>
        <div class="bar" style="--1:10"></div>
    </div>

</body>
</html>

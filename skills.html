<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Skills</title>
  <style>
/* --- Global Styles --- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: #000;
  color: #fff;
  overflow-x: hidden;
}

/* --- Navbar --- */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 8%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 100;
  border-bottom: 1px solid #7cf03d;
}

.navbar .logo {
  font-size: 22px;
  font-weight: 700;
  color: blue;
}

.navbar ul {
  display: flex;
}

.navbar ul li {
  list-style: none;
  margin: 0 20px;
}

.navbar ul li a {
  color: #fff;
  font-size: 18px;
  transition: 0.3s;
}

.navbar ul li a:hover,
.navbar ul li.active a {
  color: #7cf03d;
}

/* --- Skills Section --- */
.skills-section {
  width: 100%;
  min-height: 100vh;
  padding: 100px 10%;
  background: #111;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeIn 1.5s ease-in-out;
  background: url('images/rina-png.jpg') no-repeat center/cover;
}

@keyframes fadeIn {
  0% {
    opacity: 0;
    transform: translateY(40px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

.skills-section h1 {
  font-size: 40px;
  color: #7cf03d;
  margin-bottom: 40px;
  text-transform: uppercase;
  text-align: center;
  letter-spacing: 1px;
}

.skills-section h2 {
  font-size: 26px;
  color: #7cf03d;
  margin-bottom: 20px;
  text-align: center;
}

.skills-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
  margin-bottom: 40px;
}

.skill {
  background: #7cf03d;
  color: #000;
  padding: 10px 20px;
  border-radius: 30px;
  font-weight: 600;
  font-size: 16px;
  transition: 0.3s;
}

.skill:hover {
  background: #b9ff8f;
  transform: scale(1.1);
}

/* --- Footer --- */
footer {
  text-align: center;
  padding: 30px;
  color: #7cf03d;
  font-size: 14px;
  border-top: 1px solid #222;
  margin-top: 40px;
}

/* --- Responsive --- */
@media (max-width: 900px) {
  .skills-section {
    text-align: center;
    padding: 80px 5%;
  }
  .skills-list {
    gap: 10px;
  }
  .skill {
    font-size: 14px;
  }
}
.skills-section {
  position: relative;
  min-height: 100vh;
  background: url('your-background.jpg') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 0;
}

.skills-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.7); /* dark overlay for readability */
  backdrop-filter: blur(2px);
}

.skills-container {
  position: relative;
  z-index: 1;
  width: 90%;
  max-width: 800px;
  color: #fff;
}

.skills-container h1 {
  text-align: center;
  font-size: 40px;
  font-weight: 700;
  color: #7cf03d;
  margin-bottom: 50px;
}

.skills-container h2 {
  font-size: 24px;
  color: #7cf03d;
  margin: 40px 0 20px;
}

.skill-box {
  margin-bottom: 25px;
}

.skill-info {
  display: flex;
  justify-content: space-between;
  font-weight: 600;
  font-size: 16px;
  color: #7cf03d;
  margin-bottom: 6px;
}

.progress {
  background: #222;
  height: 10px;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  border-radius: 20px;
  background: linear-gradient(90deg, #2f2d65, #123e8a);
  transition: width 1.5s ease;
}

</style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo"> Belinda Mukhaye</div>
    <ul>
      <li><a href="/index.html">Home</a></li>
      <li class="active"><a href="/skills.html">Skills</a></li>
      <li><a href="/aboutus.html">About</a></li>
      <li><a href="/projects.html">Projects</a></li>
      <li><a href="/contact.html">Contact</a></li>
    </ul>
  </nav>
  <section class="skills-section">
  <div class="skills-container">
    <h1>MY SKILLS</h1>

    <h2>Frontend Development</h2>
    <div class="skill-box">
      <div class="skill-info">
        <span>HTML / CSS</span><span>95%</span>
      </div>
      <div class="progress"><div class="progress-bar" style="width:95%;"></div></div>
    </div>

    <div class="skill-box">
      <div class="skill-info"><span>JavaScript (ES6+)</span><span>90%</span></div>
      <div class="progress"><div class="progress-bar" style="width:90%;"></div></div>
    </div>

    <div class="skill-box">
      <div class="skill-info"><span>React</span><span>85%</span></div>
      <div class="progress"><div class="progress-bar" style="width:85%;"></div></div>
    </div>
    <div class="skill-box">
      <div class="skill-info"><span>TypeScript</span><span>75%</span></div>
      <div class="progress"><div class="progress-bar" style="width:75%;"></div></div>
    </div>

    <div class="skill-box">
      <div class="skill-info"><span>Bootstrap / Tailwind CSS</span><span>88%</span></div>
      <div class="progress"><div class="progress-bar" style="width:88%;"></div></div>
    </div>

    <div class="skill-box">
      <div class="skill-info"><span>Responsive Design</span><span>92%</span></div>
      <div class="progress"><div class="progress-bar" style="width:92%;"></div></div>
    </div>

    <h2>Backend Development</h2>
    <div class="skill-box">
      <div class="skill-info"><span>Node.js</span><span>85%</span></div>
      <div class="progress"><div class="progress-bar" style="width:85%;"></div></div>
    </div>

    <div class="skill-box">
      <div class="skill-info"><span>Python / Django</span><span>88%</span></div>
      <div class="progress"><div class="progress-bar" style="width:88%;"></div></div>
    </div>

    <div class="skill-box">
      <div class="skill-info"><span>REST APIs</span><span>90%</span></div>
      <div class="progress"><div class="progress-bar" style="width:90%;"></div></div>
    </div>

    <div class="skill-box">
      <div class="skill-info"><span>SQL / MongoDB</span><span>75%</span></div>
      <div class="progress"><div class="progress-bar" style="width:75%;"></div></div>
    </div>
  </div>
</section>


</body>
</html>

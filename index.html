    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'poppins', sans-serif;
        }
       
        a{
            text-decoration: none;
        } 
        .navbar{
            position:fixed;
            left: 0;
            top: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            visibility: hidden;
            opacity: 0;
            z-index: 100;
            animation: show-content 1.5s linear forwards;
            animation-delay: 1s;
        }
        @keyframes show-content{
            100%{
                visibility: visible;
                opacity: 1;
            }
        }
        .logo{
            font-size: 20px;
            font-weight: 700;
        }
        .navbar ul{
            
            display: flex;
        }
        .navbar ul li{
            list-style: none;
            margin: 35px;
        }
        .navbar ul li a{
            color: #fff;
            font-size: 20px;
            font-weight: 500;
            transition: .5s;
        }
        .navbar ul li a:hover,.navbar ul li.active a{
            color: palegreen;
        }
        .home{
            display: flex;
            color: #fff;
            gap: 50px;
            height: 100vh;
            padding: 60px 9% 0;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            z-index: 100;
            animation: show-content 1.5s linear forwards;
            animation-delay: 1.3s;
           
        }
        .home-info h1{
            font-size: 55px;
    
        }
        .home-info h2{
            font-size: 30px;
            margin: -10px 0;
        }
        .home-info h3{
            display: inline-block;
            font-size: 25px;
            margin-top: 8px;
            
        }
        .home-info h3 span{
            position: relative;
            display: inline-block;
            color: transparent;
            -webkit-text-stroke: .7px #7cf03d;
             animation: display-text 16s linear infinite; 
            animation-delay: calc(-4s * var(--1));
        }
        @keyframes display-text{
            25%, 100%{
                display: none;
            }
        }

        .home-info h3 span::before{
            content: attr(data-text);
            position: absolute;
            color: #7cf03d;
            width: 0%;
            border-right: 2px solid #7cf03d;
            white-space: nowrap;
            overflow: hidden;
            animation: fill-text 4s linear infinite;
        }
        @keyframes fill-text{
            10%,
            100%{
                width: 0%;
            }
            70%,
            90%{
                width: 100%;
            }
        }
        .home-info p{
            font-size: 15px;
            margin: 20px 0 25px;
        }
        .home-info .btn-sci{
            display: flex;
            align-items: center;
        }
        .btn{
            display: inline-block;
            background: palegreen;
            border: 2px solid lime;
            box-shadow: 0 0 10px rgba(0,0,0,.1);
            font-size: 16px;
            color: #000;
            font-weight: 600;
            padding: 10px 30px;
            border-radius: 40px;
            transition: 5s;
        }
        .btn:hover{
            background: transparent;
            color: #6ee64c;
            box-shadow: none;
        }
        .home-info .btn-sci .sci{
            margin-left: 20px;
        }
        .home-info .btn-sci .sci a{
            display: inline-flex;
            background: #33cd14;
            color: #000;
            font-size: 20px;
            margin: 0 8px;
            padding: 8px;
            border-radius: 50%;
            border: 2px solid lime;
            transition: .5s;
        }
        .home-info .btn-sci .sci a:hover{
            background: lawngreen;
            color: black;
            box-shadow: 0 0 10px lime;
        }
        .home-img .img-box{
            position: relative;
            height: 320px;
            width: 320px;
            /* background: red; */
            border-radius: 50%;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .home-img .img-box::before,
        .home-img .img-box::after{
            content: '';
            position: absolute;
            height: 500px;
            width: 500px;
            background: conic-gradient(transparent, transparent, transparent, #7cf03d);
            transform: rotate(0deg);
            animation : rotate-border 10s linear infinite;
        }
        .home-img .img-box::after{
            animation-delay: -5s;
        }
        @keyframes rotate-border{
            100%{
                transform: rotate(360deg);
            }
        }
        .home-img .img-box .img-item{
            position: relative;
            height: 100%;
            width: 100%;
            /* background: slateblue; */
            background: black;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            z-index: 1;
            overflow: hidden;
        }
        
        .home-img .img-box .img-item img{
            position: absolute;
            top: 30px;
            display: block;
            width: 85%;
        
            object-fit: cover;
            mix-blend-mode: lighten;
        }
        .bars-animation{
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            z-index: -1;
        }
        .bars-animation .bar{
            height: 100%;
            width: 100%;
            background: black;
            /* border: 2px solid red; */
            transform: translateY(-100%);
            animation: show-bar .5s ease-in-out forwards;
            animation-delay: calc(.1s * var(--1));
        }
        @keyframes show-bar{
            100%{
                transform: translateY(0%);
            }
        }
    </style>
